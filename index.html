<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lydia's Camping Retreat 2026 - I Will Be Attending</title>
<style>
body{margin:0;background:#2a0a5e;font-family:system-ui,sans-serif;color:#fff;text-align:center;padding:12px}
canvas{width:100%;max-width:520px;height:auto;border-radius:10px;box-shadow:0 4px 20px #0008;touch-action:manipulation}
.btns{display:flex;gap:10px;justify-content:center;margin:14px auto;max-width:520px}
button{flex:1;padding:14px;border:0;border-radius:10px;font-size:16px;font-weight:700;background:#e91e8c;color:#fff}
button.alt{background:#fff;color:#3a0ca3}
.wrap{position:relative;max-width:520px;margin:0 auto}
#f{position:absolute;left:28.03%;top:34.47%;width:43.95%;height:36.43%;opacity:0;cursor:pointer;font-size:0}
p{margin:6px;font-size:14px;opacity:.85}
</style></head><body>
<div class="wrap"><canvas id="c" width="1024" height="1024"></canvas><input type="file" id="f" accept="image/*"></div>
<p>Tap the white box to add your photo</p>
<div class="btns">
  <button id="dl">Download flyer</button>
  <button id="sh" class="alt">Share / Save</button>
</div>
<script>
const FLYER_SRC="flyer.jpg";
const BOX={x:287,y:353,w:450,h:373};
const c=document.getElementById('c'),ctx=c.getContext('2d');
const f=document.getElementById('f');
let flyer=new Image(),photo=null;

function draw(exporting){
  ctx.drawImage(flyer,0,0,1024,1024);
  if(photo){
    const s=Math.max(BOX.w/photo.width,BOX.h/photo.height);
    const w=photo.width*s,h=photo.height*s;
    ctx.save();
    ctx.beginPath();ctx.rect(BOX.x,BOX.y,BOX.w,BOX.h);ctx.clip();
    ctx.drawImage(photo,BOX.x+(BOX.w-w)/2,BOX.y+(BOX.h-h)/2,w,h);
    ctx.restore();
  }else if(!exporting){
    ctx.fillStyle='#fff';ctx.fillRect(BOX.x,BOX.y,BOX.w,BOX.h);
    ctx.setLineDash([12,8]);ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.strokeRect(BOX.x,BOX.y,BOX.w,BOX.h);ctx.setLineDash([]);ctx.fillStyle='#6a1b9a';ctx.textAlign='center';ctx.font='bold 34px sans-serif';
    ctx.fillText('+ Tap to add photo',BOX.x+BOX.w/2,BOX.y+BOX.h/2+12);
  }
}
flyer.onload=()=>draw(false);
flyer.onerror=()=>alert('flyer.jpg not found. Upload it next to index.html');
flyer.src=FLYER_SRC;

f.addEventListener('change',()=>{
  const file=f.files[0]; if(!file) return;
  const img=new Image();
  img.onload=()=>{photo=img;draw(false);URL.revokeObjectURL(img.src)};
  img.src=URL.createObjectURL(file);
});

function getBlob(){
  return new Promise(res=>{draw(true);c.toBlob(b=>{draw(false);res(b)},'image/png')});
}
function needPhoto(){ if(!photo){alert('Please add your photo first');return true} }

document.getElementById('dl').onclick=async()=>{
  if(needPhoto())return;
  const b=await getBlob(),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='lydias-retreat-2026.png';
  document.body.appendChild(a);a.click();a.remove();
};
document.getElementById('sh').onclick=async()=>{
  if(needPhoto())return;
  const b=await getBlob(),file=new File([b],'lydias-retreat-2026.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]})}catch(e){}
  }else alert('Sharing not supported here. Use Download flyer instead.');
};
</script></body></html>
